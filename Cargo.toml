[package]
authors = ["dnaq"]
description = "Fast cryptographic library for Rust (bindings to libsodium)"
documentation = "https://docs.rs/sodiumoxide"
keywords = ["crypto", "NaCl", "libsodium"]
license = "MIT OR Apache-2.0"
name = "sodiumoxide"
readme = "README.md"
repository = "https://github.com/sodiumoxide/sodiumoxide"
categories = ["cryptography"]
version = "0.2.7"
edition = "2024"
exclude = [
    "**/.gitignore",
    ".github/*"
]

[workspace]
members = ["libsodium-sys", "testcrate"]

[dependencies]
ed25519 = { version = "=2.2.3", default-features = false }
libc = { version = "^0.2.182" , default-features = false }
libsodium-sys = { version = "0.2.7", path = "libsodium-sys" }
serde = { version = "^1.0.228", default-features = false, optional = true }

[dev-dependencies]
serde = "^1.0.228"
serde_json = "^1.0.149"
rmp-serde = "^1.3.1"

[features]
benchmarks = []
std = []
default = ["serde", "std"]
use-pkg-config = ["libsodium-sys/use-pkg-config"]
